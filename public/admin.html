<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AMB Admin</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f3f4f6;
        margin: 0;
        color: #111827;
      }
      .wrap {
        max-width: 960px;
        margin: 40px auto;
        padding: 20px;
      }
      .card {
        background: #fff;
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 15px 35px rgba(15, 23, 42, 0.08);
      }
      input, button {
        width: 100%;
        padding: 12px 14px;
        margin-top: 12px;
        border-radius: 10px;
        border: 1px solid #d1d5db;
      }
      button {
        background: #f97316;
        border: none;
        font-weight: 700;
        color: white;
        cursor: pointer;
      }
      #orders {
        margin-top: 20px;
      }
      .order-item {
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        padding: 12px;
        margin-bottom: 12px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h2>AMB Admin</h2>
        <input id="adminPassword" type="password" placeholder="Admin password" />
        <button id="loginBtn" type="button">Login</button>
        <div id="adminSection" style="display:none; margin-top:20px;">
          <h3>Orders</h3>
          <div id="orders"></div>
        </div>
      </div>
    </div>

    <script>
      let token = localStorage.getItem('amb_admin_token') || '';

      async function login() {
        const password = document.getElementById('adminPassword').value;
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });
        const data = await res.json();
        if (!res.ok) {
          alert(data.error || 'Login failed');
          return;
        }
        token = data.token;
        localStorage.setItem('amb_admin_token', token);
        loadOrders();
      }

      async function loadOrders() {
        if (!token) return;
        const res = await fetch('/api/admin/orders', {
          headers: { 'x-admin-token': token }
        });
        const data = await res.json();
        document.getElementById('adminSection').style.display = 'block';
        if (!res.ok) {
          alert(data.error || 'Unable to load orders');
          return;
        }

        const orders = data.orders || [];
        const ordersEl = document.getElementById('orders');
        if (!orders.length) {
          ordersEl.innerHTML = '<p>No orders yet.</p>';
          return;
        }

        ordersEl.innerHTML = orders.map((order) => `
          <div class="order-item">
            <strong>Order:</strong> ${order.tx_ref}<br>
            <strong>Name:</strong> ${order.customerName}<br>
            <strong>Email:</strong> ${order.customerEmail}<br>
            <strong>Status:</strong> ${order.status}<br>
            <strong>Total:</strong> $${Number(order.total || 0).toFixed(2)}
          </div>
        `).join('');
      }

      document.getElementById('loginBtn').addEventListener('click', login);
      if (token) loadOrders();
    </script>
  </body>
</html>
